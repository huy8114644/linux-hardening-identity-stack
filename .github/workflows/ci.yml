name: Baseline validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make check
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - name: Run make molecule
        run: |
          set -o pipefail
          python3 -c "
import subprocess, sys
res = subprocess.run(['make', 'molecule'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
print(res.stdout)
if res.returncode != 0:
    lines = res.stdout.strip().splitlines()[-25:]
    msg = '%0A'.join(lines).replace('', '').replace(':', ' -')
    print(f'::error title=MoleculeFailed::{msg}')
    sys.exit(res.returncode)
"
