name: Baseline validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make check
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - name: Run make molecule
        run: |
          set -o pipefail
          make molecule 2>&1 | tee molecule.log
      - name: Upload Molecule Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-log
          path: molecule.log
          retention-days: 5
