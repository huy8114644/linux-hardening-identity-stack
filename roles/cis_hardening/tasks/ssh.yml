---
- name: Create OpenSSH drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Include drop-ins before distribution defaults
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and reload ssh

- name: Install restrictive SSH settings
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-cis-baseline.conf
    owner: root
    group: root
    mode: "0600"
  notify: Validate and reload ssh
