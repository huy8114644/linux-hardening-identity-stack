name: identity-lab
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 ../scripts/init_env.py first}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
  openldap:
    # This image is amd64 only; ARM hosts need emulation or a native LDAP server.
    image: osixia/openldap:1.5.0
    platform: linux/amd64
    environment:
      LDAP_ORGANISATION: Identity Lab
      LDAP_DOMAIN: enterprise.internal
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Generate .env first}
      LDAP_TLS: "false"
    command: ["--copy-service"]
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ../ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    networks: [backend]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:?Generate .env first}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Generate .env first}
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_started
    networks: [backend]
volumes:
  postgres_data:
  ldap_data:
  ldap_config:
networks:
  backend:
